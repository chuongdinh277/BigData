# Cấu hình Spark khuyến nghị cho EC2 m5.2xlarge (8 vCPU, 32 GB). Sao chép vào $SPARK_HOME/conf/
# hoặc truyền qua HG_SPARK_CONF. Lý do từng dòng ở bên phải.
spark.driver.memory                         4g      # driver chỉ điều phối, không collect() dữ liệu lớn
spark.executor.memory                       10g     # 2 executor x 10g + overhead ≈ 24 GB, chừa RAM cho OS/Docker
spark.executor.cores                        3
spark.executor.memoryOverhead               1g      # bộ nhớ ngoài heap cho Parquet/Snappy
spark.sql.shuffle.partitions                24      # 2–3 × tổng số core; AQE tự gộp partition nhỏ
spark.sql.adaptive.enabled                  true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled         true    # vài ca ICU rất dài làm lệch dữ liệu chartevents
spark.sql.session.timeZone                  UTC
spark.serializer                            org.apache.spark.serializer.KryoSerializer
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.DefaultAWSCredentialsProviderChain
spark.hadoop.fs.s3a.connection.maximum      100
spark.hadoop.fs.s3a.fast.upload             true
spark.local.dir                             /var/tmp/spark-local   # đặt trên EBS ≥ 50 GB cho shuffle
spark.eventLog.enabled                      true
spark.eventLog.dir                          file:///var/tmp/spark-events
