name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      HG_LOCAL: "1"
      HG_SPARK_MASTER: "local[2]"
      HG_SHUFFLE_PARTITIONS: "4"
      HG_DRIVER_MEMORY: "2g"
      SPARK_LOCAL_IP: "127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements-quality.txt
      - name: Chặn dữ liệu thật bị commit nhầm
        run: |
          if git ls-files | grep -Ei '\.(csv\.gz|parquet)$' | grep -v '^sample_data/'; then
            echo "Phát hiện file dữ liệu ngoài sample_data/ — xóa khỏi commit!"; exit 1; fi
      - run: python -m py_compile data_spark/*.py data_spark/common/*.py tools/*.py
      - run: python tools/make_synthetic_gold.py --rows 200 --out /tmp/gold.csv
      - run: python -m pytest -q tests --junitxml=reports/quality/pytest.xml
      - name: Verify synthetic quality workflow and rejection of bad inputs
        run: python tools/verify_quality_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            reports/quality/
            reports/stage1_fake/
